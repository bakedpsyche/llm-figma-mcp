<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LLM Figma MCP</title>
    <style>
      /* Fork: one-line status strip; colours follow Figma's theme (themeColors: true) */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font: 11px/1 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--figma-color-text, #e0e0e0);
        background: var(--figma-color-bg, #1e1e1e);
        user-select: none;
      }
      .bar {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 100%;
        padding: 0 6px 0 10px;
        box-sizing: border-box;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--figma-color-icon-warning, #f5a623);
      }
      .dot.connected { background: var(--figma-color-icon-success, #4ade80); }
      .dot.disconnected { background: var(--figma-color-icon-danger, #ff6b6b); }
      #connection-status {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button {
        flex: none;
        border: none;
        border-radius: 4px;
        padding: 4px 6px;
        font: inherit;
        cursor: pointer;
        color: var(--figma-color-text-secondary, #aaa);
        background: transparent;
      }
      button:hover { background: var(--figma-color-bg-hover, #333); }
      #progress-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 0;
        background: var(--figma-color-bg-brand, #18a0fb);
        transition: width 0.3s;
      }
    </style>
  </head>

  <body>
    <div class="bar" id="bar" title="LLM Figma MCP">
      <span class="dot" id="dot"></span>
      <span id="connection-status">Waiting for AI…</span>
      <button id="btn-connect">Disconnect</button>
      <div id="progress-bar"></div>
    </div>

    <script>
      const PORT = 3055;
      // Fixed channel (fork): the relay is localhost-only, so a fixed name
      // can't collide with anyone else. Every open plugin joins it.
      const FIXED_CHANNEL = "prem";
      const RETRY_MS = 2000;
      const WAITING_MESSAGE = "Waiting for AI…";

      const state = {
        connected: false,
        socket: null,
        channel: null,
        autoConnect: true,
        retryTimer: null,
        activeRequestId: null,
        version: "unknown",
      };

      const bar = document.getElementById("bar");
      const dot = document.getElementById("dot");
      const connectButton = document.getElementById("btn-connect");
      const connectionStatus = document.getElementById("connection-status");
      const progressBar = document.getElementById("progress-bar");

      // kind: "connected" | "disconnected" | "info"
      function setStatus(kind, text) {
        state.connected = kind === "connected";
        connectionStatus.textContent = text;
        dot.className = "dot " + kind;
        connectButton.textContent = state.autoConnect ? "Disconnect" : "Connect";
        bar.title = `LLM Figma MCP · ${text} · Build ${state.version}`;
      }

      // Fork: keep trying while the panel is open, so no click is needed
      function scheduleReconnect() {
        if (!state.autoConnect || state.connected || state.retryTimer) return;
        state.retryTimer = setTimeout(() => {
          state.retryTimer = null;
          if (state.autoConnect && !state.connected && !state.socket) connectToServer();
        }, RETRY_MS);
      }

      function cancelReconnect() {
        if (state.retryTimer) clearTimeout(state.retryTimer);
        state.retryTimer = null;
      }

      function connectToServer() {
        if (state.socket) return;
        let socket;
        try {
          socket = new WebSocket(`ws://localhost:${PORT}`);
        } catch (error) {
          console.error("Connection error:", error);
          setStatus("disconnected", "Connection error");
          scheduleReconnect();
          return;
        }
        state.socket = socket;

        socket.onopen = () => {
          state.channel = FIXED_CHANNEL;
          socket.send(JSON.stringify({ type: "join", channel: FIXED_CHANNEL }));
        };

        socket.onmessage = (event) => {
          let data;
          try {
            data = JSON.parse(event.data);
          } catch (error) {
            console.error("Error parsing message:", error);
            return;
          }
          if (data.type === "system" && data.message && data.message.result) {
            setStatus("connected", `Connected · ${data.channel}`);
          } else if (data.type === "error") {
            console.error("Error:", data.message);
            setStatus("disconnected", `Error: ${data.message}`);
            socket.close();
          }
          handleSocketMessage(data);
        };

        socket.onclose = () => {
          state.socket = null;
          if (state.autoConnect) {
            setStatus("info", WAITING_MESSAGE);
            scheduleReconnect();
          } else {
            setStatus("disconnected", "Disconnected");
          }
        };

        socket.onerror = (error) => console.error("WebSocket error:", error);
      }

      function disconnectFromServer() {
        if (state.socket) state.socket.close();
      }

      // Commands from the relay go to the plugin code
      function handleSocketMessage(payload) {
        const data = payload.message;
        if (!data || !data.command) return;
        state.activeRequestId = data.id;
        parent.postMessage(
          {
            pluginMessage: {
              type: "execute-command",
              id: data.id,
              command: data.command,
              params: data.params,
            },
          },
          "*"
        );
      }

      function send(message) {
        if (!state.connected || !state.socket) {
          console.error("Cannot send: socket not connected");
          return;
        }
        state.socket.send(JSON.stringify(message));
      }

      function sendSuccessResponse(id, result) {
        send({ id, type: "message", channel: state.channel, message: { id, result } });
      }

      function sendErrorResponse(id, error) {
        send({
          id,
          type: "message",
          channel: state.channel,
          message: { id, error, result: {} },
        });
      }

      function sendProgressUpdateToServer(progressData) {
        const id = state.activeRequestId || progressData.commandId;
        send({
          id,
          type: "progress_update",
          channel: state.channel,
          message: { id, type: "progress_update", data: progressData },
        });
      }

      let progressHideTimer = null;
      function updateProgressUI(progressData) {
        clearTimeout(progressHideTimer);
        progressBar.style.width = `${progressData.progress || 0}%`;
        if (progressData.status === "completed" || progressData.status === "error") {
          progressHideTimer = setTimeout(() => (progressBar.style.width = "0"), 1500);
        }
      }

      connectButton.addEventListener("click", () => {
        cancelReconnect();
        if (state.autoConnect) {
          state.autoConnect = false;
          disconnectFromServer();
          setStatus("disconnected", "Disconnected");
        } else {
          state.autoConnect = true;
          setStatus("info", "Connecting…");
          connectToServer();
        }
      });

      // Ask the plugin code for its build version once the UI is listening
      parent.postMessage({ pluginMessage: { type: "get-version" } }, "*");

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        switch (message.type) {
          case "plugin-version":
            state.version = message.version;
            bar.title = bar.title.replace(/Build .*$/, "") + `Build ${state.version}`;
            break;
          case "command-result":
            sendSuccessResponse(message.id, message.result);
            break;
          case "command-error":
            sendErrorResponse(message.id, message.error);
            break;
          case "command_progress":
            updateProgressUI(message);
            sendProgressUpdateToServer(message);
            break;
        }
      };

      // Fork: connect as soon as the panel opens
      setStatus("info", WAITING_MESSAGE);
      connectToServer();
    </script>
  </body>
</html>
